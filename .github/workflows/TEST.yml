name: Test

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # core on every host-runnable target, the Compose renderer's golden tests,
            # the API contract, and the web examples build
            tasks: >-
              :zircon.core:check
              :zircon.compose:jvmTest
              :zircon.terminal:check
              :zircon.examples.desktop:compileKotlinJvm
              :zircon.examples.web:wasmJsBrowserDistribution
              :zircon.examples.terminal:linkDebugExecutableLinuxX64
          - os: macos-latest
            tasks: :zircon.core:macosArm64Test :zircon.core:iosSimulatorArm64Test :zircon.compose:jvmTest :zircon.terminal:macosArm64Test :zircon.examples.terminal:linkDebugExecutableMacosArm64
          - os: windows-latest
            tasks: :zircon.core:mingwX64Test :zircon.compose:jvmTest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ${{ matrix.tasks }}
      - name: Upload rendered goldens on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-actuals-${{ matrix.os }}
          path: |
            zircon.compose/build/golden
            zircon.terminal/build/golden
          if-no-files-found: ignore
